{% extends "base.html" %}

{% block title %}Ajouter un dojo{% endblock %}

{% block content %}
<div class="row container page-adh">
    <div class="col-12">
        <h1 class="center">Ajouter un dojo</h1>

        <form method="POST">
            {{ form.hidden_tag() }}

            <div class="row align-items-center justify-content-center" >
                <div class="col-6">
                    {{ form.nom(class="form-control", placeholder="Nom") }}
                </div>

                <div class="col-2">
                    {{ form.submit(class="btn btn-primary") }}
                </div>
            </div>
        </form>

    </div>
</div>
{% endblock %}
